name: Flight snapshot

# Publishes a worldwide aircraft snapshot for the Earth view.
#
# Why a scheduled snapshot instead of the browser calling an ADS-B API directly:
# every keyless feed sends no CORS header, so a static Pages build cannot fetch
# one. The obvious fix (a Cloudflare Worker proxy) turned out to be a dead end
# too — adsb.fi and OpenSky both sit behind Cloudflare, and a Worker's subrequest
# into another Cloudflare zone is answered 403 (WAF) or 522. A GitHub runner has
# none of those problems, and raw.githubusercontent.com serves the result with
# `access-control-allow-origin: *`.
#
# Why OpenSky rather than adsb.fi, which this started on: the globe wants
# aircraft everywhere, and adsb.fi's geo search is capped at a 250 nm radius —
# one query cannot fill a planet. OpenSky answers the whole world in one call.
#
# Cost of this choice: the data is as old as the last successful run. GitHub cron
# fires on a best-effort basis, so treat the freshness as "several minutes", not
# five. The client renders the snapshot's own timestamp, never the fetch time, so
# the HUD never claims data is fresher than it is.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and trim the worldwide snapshot
        run: |
          set -euo pipefail
          # OpenSky's whole-planet query, not a 250 nm circle: adsb.fi caps a geo
          # search at 250 nm, which cannot fill a globe. Anonymous tier, 4 credits
          # per global query against 400/day — the cron fires far below that.
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            -A "solar-simulator/0.1 (+https://github.com/${GITHUB_REPOSITORY})" \
            "https://opensky-network.org/api/states/all" \
            -o raw.json
          # OpenSky answers with ~9,200 positional arrays (~1.2 MB). Trim to the
          # six fields the client reads, convert metres/(m/s) to the feet/knots the
          # client's altitude scale and HUD already speak, and sample down: the
          # renderer caps at 500 markers anyway, and every byte here crosses a
          # phone's mobile data. Even sampling keeps the spread worldwide.
          node -e '
            const raw = require("./raw.json");
            const states = Array.isArray(raw.states) ? raw.states : [];
            const positioned = states.filter(
              (s) => Number.isFinite(Number(s[6])) && Number.isFinite(Number(s[5]))
            );
            const CAP = 800;
            const step = Math.max(1, Math.floor(positioned.length / CAP));
            const ac = positioned
              .filter((_, i) => i % step === 0)
              .slice(0, CAP)
              .map((s) => ({
                hex: String(s[0] ?? ""),
                lat: Math.round(Number(s[6]) * 100) / 100,
                lon: Math.round(Number(s[5]) * 100) / 100,
                alt_baro: Math.round((Number(s[7]) || 0) * 3.28084),
                track: Math.round(Number(s[10]) || 0),
                gs: Math.round((Number(s[9]) || 0) * 1.94384),
              }));
            if (!ac.length) throw new Error("snapshot has no positioned aircraft");
            require("fs").writeFileSync(
              "flights.json",
              JSON.stringify({ ac, now: (Number(raw.time) || 0) * 1000 || Date.now(), source: "OpenSky Network" })
            );
            console.log("aircraft:", ac.length, "of", positioned.length);
          '

      - name: Publish to the flight-data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir out && mv flights.json out/
          cd out
          git init -q -b flight-data
          git config user.name "flight-snapshot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flights.json
          git commit -qm "flight snapshot $(date -u +%FT%TZ)"
          # Force-push a single-commit orphan branch: the snapshot is replaced,
          # never appended, so this branch cannot grow the repository over time.
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" flight-data
