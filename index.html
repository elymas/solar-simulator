<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is what arms the env(safe-area-inset-*) terms below (REQ-PWA-103). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>태양계 3D 우주 여행</title>
  <meta name="description" content="행성과 위성, 별을 3D로 둘러보는 태양계 시뮬레이터" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta property="og:title" content="태양계 3D 우주 여행" />
  <meta property="og:description" content="태양계를 3D로 둘러보세요" />
  <!-- apple-mobile-web-app-capable is what iOS Safari still reads (REQ-PWA-102);
       mobile-web-app-capable is the standardized replacement Chrome wants. Both
       are needed: dropping the apple- one breaks iOS standalone launch, dropping
       the standard one logs a deprecation warning on every Chrome load. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1FA90;</text></svg>" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      /* Korean-capable fallback chain: Inter carries no Hangul, so Korean text
         would otherwise land in the browser default serif (REQ-KIDS-105).
         'Inter Variable' is the self-hosted family from @fontsource-variable
         (REQ-PWA-105); the system Korean faces are the Hangul tail. */
      font-family: 'Inter Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      color: #e0e0e0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Responsive: Info Panel */
    @media (max-width: 768px) {
      .info-panel {
        width: 100% !important;
        right: -100% !important;
      }
      .info-panel.open {
        right: 0 !important;
      }
    }

    /* Responsive: Time Controls */
    @media (max-width: 768px) {
      .time-controls {
        width: calc(100% - 32px) !important;
        padding: 10px 16px !important;
        /* Additive safe-area inset (home indicator, REQ-PWA-103): 0 on
           devices/browsers without env() support, zero desktop regression. */
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important;
        gap: 12px !important;
      }
      #speed-slider {
        width: 80px !important;
      }
    }

    @media (max-width: 480px) {
      .speed-label {
        display: none !important;
      }
      .time-controls {
        gap: 8px !important;
        padding: 8px 12px !important;
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
      }
    }

    /* Responsive: Planet List */
    @media (max-width: 768px) {
      .planet-list {
        top: auto !important;
        /* Additive safe-area insets (home indicator + landscape rounded
           corner, REQ-PWA-103): 0 on devices/browsers without env() support. */
        bottom: calc(70px + env(safe-area-inset-bottom, 0px)) !important;
        left: calc(8px + env(safe-area-inset-left, 0px)) !important;
        transform: none !important;
        padding: 10px 8px !important;
        min-width: 130px !important;
      }
      .planet-list-item {
        padding: 6px 8px !important;
        font-size: 12px !important;
        /* The kid-sized floor (REQ-MOB-105) restated where the mobile values
           live, so tightening the padding above can never silently shrink a row
           below 48px. !important because this sheet parses before the
           component-injected one and would otherwise lose the tie. */
        min-height: 48px !important;
      }
    }

    /* Responsive: Earth HUD. The auto-collapse toggle (EarthHUD._checkAutoCollapse)
       already hides the panel by default under 768px — this sizing is for when a
       mobile user deliberately reopens it via the toggle button, not the primary
       mobile-fit mechanism. */
    @media (max-width: 768px) {
      .earth-hud {
        min-width: 200px !important;
        max-width: calc(100vw - 32px) !important;
        padding: 12px 14px !important;
        font-size: 12px !important;
      }
      .earth-hud-title { font-size: 16px !important; }
    }
    @media (max-width: 480px) {
      .earth-hud {
        /* Additive safe-area insets (Dynamic Island + landscape rounded
           corner, REQ-PWA-103): 0 on devices/browsers without env() support. */
        right: calc(8px + env(safe-area-inset-right, 0px)) !important;
        min-width: 180px !important;
        padding: 10px 12px !important;
      }
      .earth-hud-toggle-btn {
        top: calc(8px + env(safe-area-inset-top, 0px)) !important;
        right: calc(8px + env(safe-area-inset-right, 0px)) !important;
      }
      .earth-hud { top: calc(52px + env(safe-area-inset-top, 0px)) !important; }
    }
  </style>
</head>
<body>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
